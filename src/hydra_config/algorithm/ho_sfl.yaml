defaults:
  - base_algorithm
name          : ho_sfl
optimizer     : adamw
lr            : 0.001
betas         : [0.9, 0.999]
weight_decay  : 0.0001
# zo_p/zo_mu match the values the reference ACTUALLY RUNS WITH: all four of its
# experiment scripts (cifar10iid.sh, cifar100iid.sh, cifar10niid.sh,
# cifar100niid.sh) override conf/base.yaml's defaults with
# `algo.zo_mu=1e-3 algo.zo_p=5`. This harness previously used the unused
# base.yaml defaults (zo_p=10, zo_mu=1e-4); at mu=1e-4 the probe difference
# `a_tilde - a_m` is a ~1e-4-relative difference in fp32, i.e. near
# catastrophic cancellation, so the estimator was reading mostly rounding noise.
zo_p          : 5
zo_mu         : 1e-3
# Benchmark fairness: every method starts from the SAME random init, so HO-SFL
# does not get the paper's ImageNet-pretrained ResNet-18 + frozen BN (the only
# deliberate deviation from the paper; see src/algos/ho_sfl.py header). Set both
# to true to reproduce the paper's own setting.
use_pretrained: false
freeze_bn     : false
# Paper Alg.1 L4: clients sampled per iteration, |S_t|. 3 of our 10 clients,
# as in the paper's language experiments (3 of 10). Run with
# model.client.batch_size=107 so one update sees ~321 images, close to the
# paper's 10 clients x 32 = 320. Set to 1 for one client per iteration.
sampled_clients: 3
