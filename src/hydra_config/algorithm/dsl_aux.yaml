defaults:
  - base_algorithm

name: dsl_aux

# NOTE: no `aux_loss_weight`. The paper (SIII-C) sets lambda = 0 -- the client's
# auxiliary loss is its ONLY objective, with no server gradient to weight it
# against -- so a relative weight has no meaning here.
#
# NOTE: this method is non-federated per the paper (single client/server split,
# no weight aggregation across clients) -- num_clients=1 is the paper-faithful
# run configuration. num_clients>1 is structurally supported by this harness
# (each client trains fully independently, nothing shared) but is a degenerate
# extension beyond the paper's own setting.
#
# NOTE: the auxiliary head is NOT taken from `model/auxiliary` -- DSLAux
# installs the paper's single-FC head itself (SIV-A); see src/algos/dsl_aux.py.
