defaults:
  - dataset   : cifar10
  - model     : simple_conv
  - algorithm : fsl_sage
  - cut       : middle
  - optional dataset_model : ${dataset}_${model}
  - optional dataset_model_algorithm : ${dataset}_${model}_${algorithm}

  - _self_  
  - override hydra/hydra_logging: disabled  
  - override hydra/job_logging: disabled  
  - override hydra/launcher: joblib

save   : True
save_dir_prefix : ../saves
seed   : 200
device : cuda
use_64bit: false
num_workers : 0

rounds      : 200
num_clients : 10
agg_factor  : auto
checkpoint_interval : 5

comm_threshold_mb : 204800  # corresponds to 200 GiB

# --- measurement knobs --------------------------------------------------
# NOTE: there is no `target_acc` / Comm-to-target any more. Every method runs
# for the SAME number of rounds, and a round means one local epoch for all of
# them, so cumulative Comm-total at the final round is directly comparable and
# is what the benchmark ranks on. See docs/METRICS.md.
# Per-side (client vs. server) peak memory via autograd saved-tensor hooks.
# Set false for a pure throughput run.
measure_memory : true
# Instrument only the first N batches of each round (j == 0). The hooks cost
# ~4% when always on; every method's heaviest step is at or near the round's
# first iteration, so this is amortized to well under 1% with no loss of signal.
mem_probe_batches : 2

# to prevent logging and working directory creation by hydra
hydra:  
  output_subdir: null  
  run:  
    dir: .
  launcher:
    n_jobs: 8
    backend: loky 
    prefer: processes
    verbose: 1
